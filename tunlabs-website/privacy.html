<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy | Tunlabs Software</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0b0f; color: #e2e8f0; line-height: 1.75; margin: 0; }
    .container { max-width: 820px; margin: 3rem auto; padding: 2.5rem; background: #131620; border: 1px solid #262b3d; border-radius: 14px; }
    h1 { color: #fff; margin-bottom: 1.5rem; }
    #policy-content { white-space: pre-line; color: #cbd5e1; }
    a { color: #60a5fa; text-decoration: none; }
    .back { display: inline-block; margin-bottom: 1.5rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">← Tunlabs Software Ana Sayfa</a>
    <h1>Privacy Policy</h1>
    <div id="policy-content">Yükleniyor...</div>
  </div>
  <script>
    fetch('/data/settings.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('policy-content').textContent = data.privacy_policy || '';
      });
  </script>
</body>
</html>
